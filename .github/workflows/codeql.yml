# Actividad 3.2.4 – Análisis de seguridad con CodeQL
name: "CodeQL"

on:
  push:
    branches: [ "master" ]
  pull_request:            # <- evento que hace que corra al abrir un PR hacia master
    branches: [ "master" ]
  schedule:
    - cron: '24 18 * * 1'  # además, cada lunes

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write   # necesario para subir resultados a Code Scanning
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
