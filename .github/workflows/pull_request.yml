name: Testing Pipeline

on:
  pull_request:
    branches:
      - master

jobs:
  test_job:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar Dependencias
        run: npm install

      - name: Ejecutar Pruebas Unitarias
        run: npm test