name: Re-usable Workflow

on:
  workflow_call:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v3

      - name: Mensaje de confirmacion
        run: echo "El workflow reutilizable se ha ejecutado correctamente."
