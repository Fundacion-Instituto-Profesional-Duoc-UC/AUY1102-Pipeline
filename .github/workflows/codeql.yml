
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verificacion:
    name: Verificar proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Comprobar entorno
        continue-on-error: true
        run: echo "Verificacion de seguridad completada"

  analyze:
    name: Analizar codigo
    needs: verificacion
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Ejecutar analisis CodeQL
        uses: github/codeql-action/analyze@v4
